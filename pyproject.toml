[build-system]
requires = ["setuptools>=75", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "rlp"
dynamic = ["version"]
description = "rlp: A package for Recursive Length Prefix encoding and decoding"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
authors = [
    { name = "jnnk", email = "jnnknnj@gmail.com" },
    { name = "ApeWorX Collective", email = "admin@apeworx.io" },
]
maintainers = [
    { name = "ApeWorX Collective", email = "admin@apeworx.io" },
]
keywords = ["rlp", "ethereum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "eth-utils>=2",
]

[project.urls]
Homepage = "https://github.com/ApeWorX/pyrlp"
Repository = "https://github.com/ApeWorX/pyrlp.git"
Issues = "https://github.com/ApeWorX/pyrlp/issues"
Documentation = "https://pyrlp.readthedocs.io/"

[project.optional-dependencies]
rust-backend = [
    "rusty-rlp>=0.2.1",
]

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-xdist>=2.4.0",
    "hypothesis>=6.22.0,<6.108.7",
]
benchmark = [
    { include-group = "test" },
    "pytest-benchmark>=4.0.0",
]
lint = [
    "ruff>=0.12.0",
    "mypy>=1.18.2",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
docs = [
    "sphinx>=6.0.0,<9",
    "sphinx-autobuild>=2021.3.14",
    "sphinx_rtd_theme>=1.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "benchmark" },
    { include-group = "lint" },
    { include-group = "docs" },
    "ipython",
    "prek",
]

[tool.setuptools.packages.find]
include = ["rlp", "rlp.*"]
exclude = ["scripts", "scripts.*", "tests", "tests.*"]

[tool.setuptools_scm]
fallback_version = "5.0.0b1"

[tool.mypy]
check_untyped_defs = true
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "index",
    "list-item",
    "method-assign",
    "str-bytes-safe",
    "var-annotated",
]
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
ignore_missing_imports = true
strict_equality = true
strict_optional = true
warn_redundant_casts = false
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = false

[tool.pytest.ini_options]
addopts = "-v --showlocals --durations 10"
log_date_format = "%m-%d %H:%M:%S"
log_format = "%(levelname)8s  %(asctime)s  %(filename)20s  %(message)s"
markers = "benchmark"
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".project-template", "docs/conf.py"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "UP",
    "D2",
    "D3",
    "D4",
]
ignore = [
    "B018",
    "B024",
    "B904",
    "B905",
    "D200",
    "D203",
    "D204",
    "D205",
    "D212",
    "D400",
    "D401",
    "D412",
    "D415",
    "E741",
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["pytest"]
force-sort-within-sections = true
force-to-top = ["pytest"]
known-first-party = ["rlp"]
known-third-party = ["hypothesis"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"
docstring-code-format = true

[tool.mdformat]
number = true
